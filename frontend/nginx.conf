server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 location = /api/webhooks/instagram {
   access_log off;
   error_log /dev/null;
   if ($request_method !~ ^(GET|POST)$) { return 405; }
   proxy_pass http://backend:8000;
 }
 location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
 location / { try_files $uri $uri/ /index.html; }
}
