services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aen
      POSTGRES_USER: aen
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aen -d aen"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://aen:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/aen
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      IG_VERIFY_TOKEN: ${IG_VERIFY_TOKEN:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      IG_ACCESS_TOKEN: ${IG_ACCESS_TOKEN:-}
      IG_ACCOUNT_ID: ${IG_ACCOUNT_ID:-}
      IG_PAGE_ID: ${IG_PAGE_ID:-}
      IG_CITY_NAME: ${IG_CITY_NAME:-Семей}
      IG_AUTH_MODE: ${IG_AUTH_MODE:-facebook}
      IG_GRAPH_VERSION: ${IG_GRAPH_VERSION:-v24.0}
      ENABLE_DEMO_INGEST: ${ENABLE_DEMO_INGEST:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
  webhook:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./webhook-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
volumes:
  postgres_data:
