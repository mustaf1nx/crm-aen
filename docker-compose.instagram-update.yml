# Use alongside your EXISTING docker-compose.yml from the SAME project directory.
services:
  backend:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--no-access-log"]
    environment:
      IG_GRAPH_VERSION: ${IG_GRAPH_VERSION:-v24.0}
  webhook:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./webhook-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
